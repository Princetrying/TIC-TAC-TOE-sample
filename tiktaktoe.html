<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>🎮 Tic Tac Toe | Classic Two-Player Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none; /* prevent accidental text selection while clicking */
      }

      body {
        background: linear-gradient(145deg, #1e2b3c 0%, #0f1a24 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        padding: 1.5rem;
        margin: 0;
      }

      /* main game card */
      .game-container {
        background: rgba(22, 34, 48, 0.75);
        backdrop-filter: blur(2px);
        border-radius: 3.5rem;
        padding: 1.8rem 2rem 2rem 2rem;
        box-shadow:
          0 25px 45px rgba(0, 0, 0, 0.5),
          inset 0 1px 2px rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.2s ease;
      }

      .game-panel {
        background: #0f1722;
        border-radius: 2rem;
        padding: 1.2rem;
        box-shadow:
          inset 0 2px 5px rgba(0, 0, 0, 0.4),
          0 8px 20px rgba(0, 0, 0, 0.3);
      }

      h1 {
        text-align: center;
        font-weight: 700;
        letter-spacing: 2px;
        font-size: 2rem;
        background: linear-gradient(135deg, #f5e7c8, #e0cba0);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        margin-bottom: 1rem;
      }

      /* turn & status area */
      .status-area {
        background: #1e2a36;
        border-radius: 3rem;
        padding: 0.7rem 1.5rem;
        margin-bottom: 1.8rem;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.7rem;
        box-shadow:
          inset 0 1px 3px #2a3b48,
          0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .turn-indicator {
        background: #0a111a;
        padding: 0.4rem 1.2rem;
        border-radius: 2rem;
        font-weight: bold;
        font-size: 1.3rem;
        color: #ffde9c;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        box-shadow:
          inset 0 1px 2px rgba(0, 0, 0, 0.5),
          0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .turn-symbol {
        background: #2c3e2f;
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 1.6rem;
        font-weight: 800;
        box-shadow:
          inset 0 0 4px #00000040,
          0 2px 4px rgba(0, 0, 0, 0.3);
      }

      .turn-text {
        font-size: 1.2rem;
        font-weight: 600;
      }

      .message-box {
        background: #00000066;
        backdrop-filter: blur(4px);
        padding: 0.4rem 1.2rem;
        border-radius: 2rem;
        font-weight: 600;
        font-size: 1rem;
        color: #e6e9f0;
        letter-spacing: 0.3px;
      }

      /* grid board */
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.9rem;
        background-color: #0b1119;
        padding: 1.2rem;
        border-radius: 2.2rem;
        margin-bottom: 1.6rem;
        box-shadow:
          inset 0 0 0 2px #2e4053,
          0 12px 24px rgba(0, 0, 0, 0.5);
      }

      /* cell button style */
      .cell {
        aspect-ratio: 1 / 1;
        background: #1f2e3f;
        border: none;
        border-radius: 1.8rem;
        font-size: 4rem;
        font-weight: 800;
        font-family: "Segoe UI", "Poppins", system-ui;
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        color: #f3e7c0;
        text-shadow: 0 3px 5px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 0 #0a1018;
        transform: translateY(-2px);
      }

      .cell:hover:not(:disabled) {
        background: #2d435a;
        transform: scale(0.98) translateY(0px);
        box-shadow: 0 2px 0 #0a1018;
        color: #ffe5b4;
      }

      .cell:active:not(:disabled) {
        transform: scale(0.96) translateY(2px);
        box-shadow: 0 1px 0 #0a1018;
      }

      .cell:disabled {
        opacity: 0.85;
        cursor: default;
        transform: translateY(0px);
        box-shadow: 0 2px 0 #0a1018;
        filter: brightness(0.96);
      }

      /* winning cells highlight */
      .cell.win-highlight {
        background: #d4af37;
        background: linear-gradient(145deg, #f5c542, #d4a017);
        color: #1e2a2f;
        text-shadow: none;
        box-shadow: 0 0 10px #ffdf80;
        border: 1px solid #ffecb3;
        transform: scale(1.01);
      }

      /* reset button */
      .reset-btn {
        background: linear-gradient(95deg, #2c485e, #1e3347);
        width: 100%;
        border: none;
        padding: 0.9rem;
        border-radius: 3rem;
        font-weight: bold;
        font-size: 1.3rem;
        letter-spacing: 1px;
        color: #ffefcf;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        box-shadow: 0 5px 0 #0a111e;
        font-family: inherit;
      }

      .reset-btn:hover {
        background: linear-gradient(95deg, #3e5e7a, #2a4057);
        transform: translateY(-2px);
        box-shadow: 0 7px 0 #0a111e;
      }

      .reset-btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #0a111e;
      }

      /* footer */
      .footer-note {
        text-align: center;
        font-size: 0.75rem;
        margin-top: 1rem;
        color: #8ba0b0;
        font-weight: 500;
      }

      @media (max-width: 500px) {
        .game-container {
          padding: 1rem 1.2rem 1.5rem;
        }
        .cell {
          font-size: 2.8rem;
        }
        .turn-indicator {
          font-size: 1rem;
          padding: 0.2rem 0.9rem;
        }
        .turn-symbol {
          width: 28px;
          height: 28px;
          font-size: 1.3rem;
        }
        .board {
          gap: 0.6rem;
          padding: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="game-panel">
        <h1>✧ TIC TAC TOE
           ✧</h1>

        <div class="status-area">
          <div class="turn-indicator" id="turnIndicator">
            <span class="turn-symbol" id="turnSymbol">X</span>
            <span class="turn-text" id="turnText">Turn</span>
          </div>
          <div class="message-box" id="statusMsg">Player X's move</div>
        </div>

        <!-- dynamic board will be injected here -->
        <div id="boardContainer" class="board"></div>

        <button class="reset-btn" id="resetGameBtn">🔄 NEW GAME</button>
        <div class="footer-note">
          ✨ Vibe-coded by Prince :P ✨
        </div>
      </div>
    </div>

    <script>
      (function () {
        // ---------- GAME STATE ----------
        let boardState = Array(9).fill(null); // Stores 'X' or 'O'
        let currentPlayer = "X"; // X always starts
        let gameActive = true;
        let winningCombination = null; // store winning indexes for highlight
        let boardButtons = []; // references to button DOM elements

        // DOM elements
        const boardContainer = document.getElementById("boardContainer");
        const resetBtn = document.getElementById("resetGameBtn");
        const turnSymbolSpan = document.getElementById("turnSymbol");
        const turnTextSpan = document.getElementById("turnText");
        const statusMsgDiv = document.getElementById("statusMsg");

        // Win patterns (8 possible lines)
        const winPatterns = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8], // rows
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8], // columns
          [0, 4, 8],
          [2, 4, 6], // diagonals
        ];

        // ---------- HELPER FUNCTIONS ----------
        function updateUIForTurn() {
          // Update the turn indicator in status area
          turnSymbolSpan.textContent = currentPlayer;
          // optional dynamic background based on player
          turnSymbolSpan.style.background =
            currentPlayer === "X" ? "#375a4e" : "#7a4c3c";
          if (gameActive) {
            statusMsgDiv.innerHTML = `⚡ Player ${currentPlayer}'s turn ⚡`;
            turnTextSpan.textContent = "Turn";
          }
        }

        // Disable or enable all board buttons (physical + visual)
        function setButtonsEnabled(enabled) {
          for (let i = 0; i < boardButtons.length; i++) {
            const btn = boardButtons[i];
            if (enabled) {
              btn.disabled = false;
            } else {
              // disable only if game is over or forced, but keep cell status if filled? fine
              btn.disabled = true;
            }
          }
        }

        // Clear any win highlight class from all cells
        function clearWinHighlights() {
          for (let i = 0; i < boardButtons.length; i++) {
            boardButtons[i].classList.remove("win-highlight");
          }
        }

        // Highlight winning cells based on pattern indexes
        function highlightWinningCells(pattern) {
          if (!pattern) return;
          for (let idx of pattern) {
            if (boardButtons[idx]) {
              boardButtons[idx].classList.add("win-highlight");
            }
          }
        }

        // Show game over message (win or tie)
        function setGameOverMessage(message, isWin = false) {
          statusMsgDiv.innerHTML = message;
          if (isWin) {
            // additional sparkling vibe in message
            turnTextSpan.textContent = "Winner!";
          } else {
            turnTextSpan.textContent = "Game Over";
          }
        }

        // Check if board is full (draw)
        function isBoardFull() {
          return boardState.every((cell) => cell !== null);
        }

        // Check win for current board state, returns { winner: 'X'/'O' or null, pattern: array|null }
        function checkWinnerOnBoard() {
          for (let pattern of winPatterns) {
            const [a, b, c] = pattern;
            if (
              boardState[a] &&
              boardState[a] === boardState[b] &&
              boardState[a] === boardState[c]
            ) {
              return { winner: boardState[a], pattern: pattern };
            }
          }
          return { winner: null, pattern: null };
        }

        // End game with a win (highlights, disables, shows message)
        function endGameWithWin(winner, pattern) {
          gameActive = false;
          winningCombination = pattern;
          // Disable all moves (buttons)
          setButtonsEnabled(false);
          // Highlight winning cells
          highlightWinningCells(pattern);
          // Set win message
          const winMessage = `🎉✨ PLAYER ${winner} WINS! ✨🎉`;
          setGameOverMessage(winMessage, true);
          // extra status for turn area
          turnSymbolSpan.textContent = winner;
          turnTextSpan.textContent = "Victory!";
        }

        // End game as draw (tie)
        function endGameWithDraw() {
          gameActive = false;
          setButtonsEnabled(false);
          setGameOverMessage("🤝 IT'S A TIE! 🤝", false);
          turnTextSpan.textContent = "Draw";
          turnSymbolSpan.textContent = "🎲";
        }

        // Evaluate the game after a move (win / draw / continue)
        function evaluateGameAfterMove() {
          const { winner, pattern } = checkWinnerOnBoard();

          if (winner) {
            endGameWithWin(winner, pattern);
            return;
          }

          // Check for draw
          if (isBoardFull()) {
            endGameWithDraw();
            return;
          }

          // No winner, no draw -> switch player and continue
          currentPlayer = currentPlayer === "X" ? "O" : "X";
          updateUIForTurn();
        }

        // Process a single cell click
        function handleCellClick(index) {
          // Validation: game must be active, cell must be empty, not already disabled by state
          if (!gameActive) return;
          if (boardState[index] !== null) return;

          // Mark the move
          boardState[index] = currentPlayer;
          const button = boardButtons[index];
          button.textContent = currentPlayer;
          button.disabled = true; // visually and logically disable clicked cell

          // After move, check win/draw/switch
          evaluateGameAfterMove();
        }

        // ---------- RESET / NEW GAME FUNCTION ----------
        function resetGame() {
          // Reset game state variables
          boardState.fill(null);
          currentPlayer = "X";
          gameActive = true;
          winningCombination = null;

          // Clear highlights on all buttons
          clearWinHighlights();

          // Reset button text, enable all buttons, remove any leftover disabled flag
          for (let i = 0; i < boardButtons.length; i++) {
            const btn = boardButtons[i];
            btn.textContent = "";
            btn.disabled = false;
            // ensure any win class is gone
            btn.classList.remove("win-highlight");
          }

          // Reset turn visuals and status message
          updateUIForTurn();
          turnSymbolSpan.style.background = "#375a4e"; // X default style
          turnTextSpan.textContent = "Turn";
          statusMsgDiv.innerHTML = "✨ Player X's move ✨";
          // extra guard: if any hover state weirdness, fine
        }

        // ---------- CREATE DYNAMIC BOARD ----------
        function buildBoardUI() {
          boardContainer.innerHTML = ""; // clear any existing
          boardButtons = [];

          for (let i = 0; i < 9; i++) {
            const cellBtn = document.createElement("button");
            cellBtn.classList.add("cell");
            cellBtn.setAttribute("data-index", i);
            cellBtn.setAttribute("aria-label", `cell ${i}`);
            // set initial empty text
            cellBtn.textContent = "";
            // attach click event with index closure
            cellBtn.addEventListener(
              "click",
              (function (idx) {
                return function () {
                  handleCellClick(idx);
                };
              })(i),
            );

            boardContainer.appendChild(cellBtn);
            boardButtons.push(cellBtn);
          }
        }

        // ---------- INITIAL SETUP ----------
        function initGame() {
          buildBoardUI(); // creates fresh buttons
          resetGame(); // sets boardState null, enables buttons, clean state
        }

        // reset button listener (re-initializes everything to fresh state)
        resetBtn.addEventListener("click", () => {
          // full reset: reinitialize all game data without re-building DOM (faster)
          // but we must also reset board state array and button appearances
          boardState.fill(null);
          currentPlayer = "X";
          gameActive = true;
          winningCombination = null;
          clearWinHighlights();

          for (let i = 0; i < boardButtons.length; i++) {
            const btn = boardButtons[i];
            btn.textContent = "";
            btn.disabled = false;
            btn.classList.remove("win-highlight");
          }
          // reset visual turn and message
          updateUIForTurn();
          turnSymbolSpan.style.background = "#375a4e";
          turnTextSpan.textContent = "Turn";
          statusMsgDiv.innerHTML = "✨ Player X's move ✨";
          // ensure any lingering gameActive true
        });

        // start everything
        initGame();
      })();
    </script>
  </body>
</html>
